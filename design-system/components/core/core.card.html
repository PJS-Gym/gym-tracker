<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>PJS Gym · Core components</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px}.r{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.c{display:flex;flex-direction:column;gap:14px}</style></head><body><div id="root"></div>
<script type="text/babel">
const NS=window.PJSGymDesignSystem_ff31cf;
const {Button,IconButton,Badge,Chip,Icon,Wordmark}=NS;
function App(){const [chip,setChip]=React.useState("All");const [saved,setSaved]=React.useState(false);
return <div className="c">
<div className="r"><Button size="lg">Start workout</Button><Button variant="secondary" icon="play">Resume</Button><Button variant="tonal" icon="plus">Add exercise</Button></div>
<div className="r"><Button variant="outline" size="sm">Skip</Button><Button variant="ghost" size="sm">See all</Button><Button variant="danger" size="sm">Discard</Button><Button size="sm" disabled>Disabled</Button></div>
<div className="r"><IconButton icon="chevron-left" variant="tonal" label="Back"/><IconButton icon="settings" variant="overlay" label="Settings"/><IconButton icon="plus" variant="accent" label="Add"/><IconButton icon="heart" variant="soft" size={56} label="Save" pressed={saved} onClick={()=>setSaved(!saved)}/><IconButton icon="ellipsis" label="More options"/></div>
<div className="r"><Badge tone="success">New PR</Badge><Badge tone="live">Live now</Badge><Badge tone="soft">Booked</Badge><Badge>Beginner</Badge></div>
<div className="r">{["All","Dumbbells","Mobility","30 min"].map(x=><Chip key={x} selected={chip===x} onClick={()=>setChip(x)}>{x}</Chip>)}</div>
<div className="r" style={{color:"var(--text-2)"}}>{["dumbbell","timer","flame","trophy","heart","calendar-days","send","download","house","user","search","clipboard-list"].map(n=><Icon key={n} name={n}/>)}</div>
<div className="r" style={{gap:24,alignItems:"center"}}><Wordmark size="s"/><Wordmark size="m"/><span data-theme="dark" style={{background:"var(--surface-app)",color:"var(--text-1)",padding:"10px 16px",borderRadius:14}}><Wordmark size="m" lockup/></span></div>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>

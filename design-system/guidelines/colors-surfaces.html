<!-- @dsCard group="Colors" viewport="700x170" name="Surfaces (light)" subtitle="Default theme: white canvas, warm ink-100 fills" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>PJS Gym · Surfaces (light)</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-app);color:var(--text-1);font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:60px;display:flex;flex-direction:column;gap:4px}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--border-subtle)}.n{font-weight:700;color:var(--text-1)}.v{color:var(--text-2);font-variant-numeric:tabular-nums}.note{margin:14px 0 0;color:var(--text-2);font-size:13px;max-width:62ch}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--surface-app)"></div><div class="n">surface-app</div><div class="v" data-tok="surface-app"></div></div><div class="sw"><div class="chip" style="background:var(--surface-card)"></div><div class="n">surface-card</div><div class="v" data-tok="surface-card"></div></div><div class="sw"><div class="chip" style="background:var(--surface-raised)"></div><div class="n">surface-raised</div><div class="v" data-tok="surface-raised"></div></div><div class="sw"><div class="chip" style="background:var(--surface-field)"></div><div class="n">surface-field</div><div class="v" data-tok="surface-field"></div></div><div class="sw"><div class="chip" style="background:var(--surface-sunken)"></div><div class="n">surface-sunken</div><div class="v" data-tok="surface-sunken"></div><div class=v>no text, no controls</div></div><div class="sw"><div class="chip" style="background:var(--surface-inverse)"></div><div class="n">surface-inverse</div><div class="v" data-tok="surface-inverse"></div></div></div><p class="note">Raised and field share ink-100. Sunken is a non-text surface: text-3 and control borders fall below their minimums on it.</p><script>(()=>{const hex=c=>{const m=c.match(/rgba?\(([^)]+)\)/);if(!m)return c.trim();const p=m[1].split(/[ ,\/]+/).map(Number);const h=p.slice(0,3).map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase();return p.length>3&&p[3]<1?"#"+h+" @"+p[3]:"#"+h;};const probe=document.createElement("i");document.body.appendChild(probe);document.querySelectorAll("[data-tok]").forEach(el=>{const host=el.closest("[data-theme]")||document.documentElement;host.appendChild(probe);probe.style.color="var(--"+el.dataset.tok+")";el.textContent=hex(getComputedStyle(probe).color);});probe.remove();})();</script></body></html>

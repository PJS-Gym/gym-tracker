<!-- @dsCard group="Type" viewport="700x160" name="Titles" subtitle="Archivo Bold, sentence case, normal width" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>PJS Gym · Titles</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-app);color:var(--text-1);font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:60px;display:flex;flex-direction:column;gap:4px}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--border-subtle)}.n{font-weight:700;color:var(--text-1)}.v{color:var(--text-2);font-variant-numeric:tabular-nums}.note{margin:14px 0 0;color:var(--text-2);font-size:13px;max-width:62ch}</style></head><body><div style="display:flex;flex-direction:column;gap:8px"><div style="font-size:var(--fs-title-l);font-weight:700;line-height:1.2">Morning, Jordan. Today is mobility.</div><div style="font-size:var(--fs-title-m);font-weight:700;line-height:1.2">Glutes did the most work</div><div style="font-size:var(--fs-title-s);font-weight:700;line-height:1.25">Bench Press (Barbell)</div><div class="v">title-l 26/1.2 · title-m 20/1.2 (section headers) · title-s 17/1.25 (exercise names, top bar)</div></div><script>(()=>{const hex=c=>{const m=c.match(/rgba?\(([^)]+)\)/);if(!m)return c.trim();const p=m[1].split(/[ ,\/]+/).map(Number);const h=p.slice(0,3).map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase();return p.length>3&&p[3]<1?"#"+h+" @"+p[3]:"#"+h;};const probe=document.createElement("i");document.body.appendChild(probe);document.querySelectorAll("[data-tok]").forEach(el=>{const host=el.closest("[data-theme]")||document.documentElement;host.appendChild(probe);probe.style.color="var(--"+el.dataset.tok+")";el.textContent=hex(getComputedStyle(probe).color);});probe.remove();})();</script></body></html>

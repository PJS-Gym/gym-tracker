<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>PJS Gym · Body & labels</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-app);color:var(--text-1);font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:60px;display:flex;flex-direction:column;gap:4px}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--border-subtle)}.n{font-weight:700;color:var(--text-1)}.v{color:var(--text-2);font-variant-numeric:tabular-nums}.note{margin:14px 0 0;color:var(--text-2);font-size:13px;max-width:62ch}</style></head><body><div style="display:flex;flex-direction:column;gap:8px;max-width:560px"><div style="font-size:16px">Keep two reps in reserve on the last set. Rest 90 s between sets.</div><div style="font-size:14px;color:var(--text-2)">5 exercises · 55 min</div><div class="pjs-label" style="color:var(--text-2)">Routine name</div><div style="font-size:12px;color:var(--text-2)">Last done 2 days ago</div><div style="font-size:16px">Łukasz, Zażółć gęślą jaźń</div><div class="v">body 16/1.4 · body-s 14/1.4 · label 13/600 · caption 12 · weights 400, 600, 700, 800 · latin + Polish glyphs</div></div><script>(()=>{const hex=c=>{const m=c.match(/rgba?\(([^)]+)\)/);if(!m)return c.trim();const p=m[1].split(/[ ,\/]+/).map(Number);const h=p.slice(0,3).map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase();return p.length>3&&p[3]<1?"#"+h+" @"+p[3]:"#"+h;};const probe=document.createElement("i");document.body.appendChild(probe);document.querySelectorAll("[data-tok]").forEach(el=>{const host=el.closest("[data-theme]")||document.documentElement;host.appendChild(probe);probe.style.color="var(--"+el.dataset.tok+")";el.textContent=hex(getComputedStyle(probe).color);});probe.remove();})();</script></body></html>

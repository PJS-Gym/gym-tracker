<!-- @dsCard group="Colors" viewport="700x200" name="Data viz" subtitle="Pink marks the one bar that matters; ink-500 is context" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>PJS Gym · Data viz</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-app);color:var(--text-1);font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:60px;display:flex;flex-direction:column;gap:4px}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--border-subtle)}.n{font-weight:700;color:var(--text-1)}.v{color:var(--text-2);font-variant-numeric:tabular-nums}.note{margin:14px 0 0;color:var(--text-2);font-size:13px;max-width:62ch}</style></head><body><div style="display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap"><div><div style="display:flex;gap:6px;align-items:flex-end;height:110px;width:260px;border-bottom:1px solid var(--border-strong)"><div style="flex:1;height:40%;border-radius:2px 2px 0 0;background:var(--data-context)"></div><div style="flex:1"></div><div style="flex:1;height:62%;border-radius:2px 2px 0 0;background:var(--data-context)"></div><div style="flex:1;height:48%;border-radius:2px 2px 0 0;background:var(--data-context)"></div><div style="flex:1"></div><div style="flex:1;height:95%;border-radius:2px 2px 0 0;background:var(--data-1)"></div><div style="flex:1;height:30%;border-radius:2px 2px 0 0;background:var(--data-context)"></div></div><div class="v" style="margin-top:6px">Volume peaked on Saturday · 5,280 kg</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;gap:8px;align-items:center"><span style="width:28px;height:14px;border-radius:2px;background:var(--data-1)"></span><span class="n">data-1</span><span class="v" data-tok="data-1"></span><span class="v">· the point, always labelled</span></div><div style="display:flex;gap:8px;align-items:center"><span style="width:28px;height:14px;border-radius:2px;background:var(--data-2)"></span><span class="n">data-2</span><span class="v" data-tok="data-2"></span><span class="v">· second series</span></div><div style="display:flex;gap:8px;align-items:center"><span style="width:28px;height:14px;border-radius:2px;background:var(--data-3)"></span><span class="n">data-3</span><span class="v" data-tok="data-3"></span><span class="v">· third series</span></div><div style="display:flex;gap:8px;align-items:center"><span style="width:28px;height:14px;border-radius:2px;background:var(--data-context)"></span><span class="n">data-context</span><span class="v" data-tok="data-context"></span><span class="v">· context bars (3.58:1)</span></div><div style="display:flex;gap:8px;align-items:center"><span style="width:28px;height:14px;border-radius:2px;background:var(--data-track)"></span><span class="n">data-track</span><span class="v" data-tok="data-track"></span><span class="v">· progress tracks</span></div></div></div><p class="note">Zero baseline, one scale, 0 draws no bar, label the decisive value directly, and say what to notice in the heading.</p><script>(()=>{const hex=c=>{const m=c.match(/rgba?\(([^)]+)\)/);if(!m)return c.trim();const p=m[1].split(/[ ,\/]+/).map(Number);const h=p.slice(0,3).map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase();return p.length>3&&p[3]<1?"#"+h+" @"+p[3]:"#"+h;};const probe=document.createElement("i");document.body.appendChild(probe);document.querySelectorAll("[data-tok]").forEach(el=>{const host=el.closest("[data-theme]")||document.documentElement;host.appendChild(probe);probe.style.color="var(--"+el.dataset.tok+")";el.textContent=hex(getComputedStyle(probe).color);});probe.remove();})();</script></body></html>

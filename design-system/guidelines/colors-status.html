<!-- @dsCard group="Colors" viewport="700x140" name="Status" subtitle="Text-safe on white; tints in dark" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>PJS Gym · Status</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-app);color:var(--text-1);font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:60px;display:flex;flex-direction:column;gap:4px}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--border-subtle)}.n{font-weight:700;color:var(--text-1)}.v{color:var(--text-2);font-variant-numeric:tabular-nums}.note{margin:14px 0 0;color:var(--text-2);font-size:13px;max-width:62ch}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--status-success)"></div><div class="n">success</div><div class="v" data-tok="status-success"></div><div class=v>5.84:1</div></div><div class="sw"><div class="chip" style="background:var(--status-warning)"></div><div class="n">warning</div><div class="v" data-tok="status-warning"></div><div class=v>5.93:1</div></div><div class="sw"><div class="chip" style="background:var(--status-danger)"></div><div class="n">danger</div><div class="v" data-tok="status-danger"></div><div class=v>5.37:1</div></div><div class="sw"><div class="chip" style="background:var(--status-info)"></div><div class="n">info</div><div class="v" data-tok="status-info"></div><div class=v>8.8:1</div></div></div><div data-theme="dark" style="margin-top:12px;background:var(--surface-app);padding:12px;border-radius:14px;color:var(--text-1)"><div class="row"><div class="sw"><div class="chip" style="background:var(--status-success)"></div><div class="n">success (dark)</div><div class="v" data-tok="status-success"></div></div><div class="sw"><div class="chip" style="background:var(--status-warning)"></div><div class="n">warning (dark)</div><div class="v" data-tok="status-warning"></div></div><div class="sw"><div class="chip" style="background:var(--status-danger)"></div><div class="n">danger (dark)</div><div class="v" data-tok="status-danger"></div></div></div></div><script>(()=>{const hex=c=>{const m=c.match(/rgba?\(([^)]+)\)/);if(!m)return c.trim();const p=m[1].split(/[ ,\/]+/).map(Number);const h=p.slice(0,3).map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase();return p.length>3&&p[3]<1?"#"+h+" @"+p[3]:"#"+h;};const probe=document.createElement("i");document.body.appendChild(probe);document.querySelectorAll("[data-tok]").forEach(el=>{const host=el.closest("[data-theme]")||document.documentElement;host.appendChild(probe);probe.style.color="var(--"+el.dataset.tok+")";el.textContent=hex(getComputedStyle(probe).color);});probe.remove();})();</script></body></html>

<!-- @dsCard group="Spacing" viewport="700x190" name="Elevation & overlay" subtitle="Surface steps first; shadows only on things that float" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>PJS Gym · Elevation & overlay</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-app);color:var(--text-1);font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:60px;display:flex;flex-direction:column;gap:4px}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--border-subtle)}.n{font-weight:700;color:var(--text-1)}.v{color:var(--text-2);font-variant-numeric:tabular-nums}.note{margin:14px 0 0;color:var(--text-2);font-size:13px;max-width:62ch}</style></head><body><div class="row" style="gap:16px;height:130px;flex-wrap:nowrap"><div style="flex:1;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:20px;padding:12px" class="v">card · 1px border, no shadow</div><div style="flex:1;background:var(--surface-raised);border-radius:20px;padding:12px" class="v">raised · tonal fills</div><div style="flex:1;background:var(--surface-card);border-radius:20px;padding:12px;box-shadow:var(--shadow-float)" class="v">shadow-float · toast, docked bars, floating CTA</div><div style="flex:1;position:relative;border-radius:20px;overflow:hidden;background:var(--surface-raised)"><div style="position:absolute;inset:0;background:var(--scrim)"></div><div style="position:absolute;left:0;right:0;bottom:0;height:60%;background:var(--surface-card);border-radius:20px 20px 0 0;box-shadow:var(--shadow-sheet);padding:12px" class="v">sheet over scrim</div></div></div><p class="note">No glass, no blur. Icon buttons over photos use the solid --surface-overlay chip.</p><script>(()=>{const hex=c=>{const m=c.match(/rgba?\(([^)]+)\)/);if(!m)return c.trim();const p=m[1].split(/[ ,\/]+/).map(Number);const h=p.slice(0,3).map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase();return p.length>3&&p[3]<1?"#"+h+" @"+p[3]:"#"+h;};const probe=document.createElement("i");document.body.appendChild(probe);document.querySelectorAll("[data-tok]").forEach(el=>{const host=el.closest("[data-theme]")||document.documentElement;host.appendChild(probe);probe.style.color="var(--"+el.dataset.tok+")";el.textContent=hex(getComputedStyle(probe).color);});probe.remove();})();</script></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>PJS Gym · Text, lines & focus</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-app);color:var(--text-1);font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:60px;display:flex;flex-direction:column;gap:4px}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--border-subtle)}.n{font-weight:700;color:var(--text-1)}.v{color:var(--text-2);font-variant-numeric:tabular-nums}.note{margin:14px 0 0;color:var(--text-2);font-size:13px;max-width:62ch}</style></head><body><div class="row" style="align-items:flex-start;gap:28px"><div style="display:flex;flex-direction:column;gap:6px;font-size:18px;font-weight:600"><span style="color:var(--text-1)">text-1 · 16.4:1</span><span style="color:var(--text-2)">text-2 · 8.8:1</span><span style="color:var(--text-3)">text-3 · 5.7:1</span><span style="color:var(--text-accent)">text-accent · 6.65:1</span><span style="background:var(--accent-soft);color:var(--text-on-accent-soft);padding:2px 8px;border-radius:6px">text-on-accent-soft · 6.30:1</span></div><div style="display:flex;flex-direction:column;gap:10px;flex:1"><div style="height:32px;border:1px solid var(--border-subtle);border-radius:10px;padding:7px 10px" class="v">border-subtle · dividers</div><div style="height:32px;border:1px solid var(--border-strong);border-radius:10px;padding:7px 10px" class="v">border-strong · chart baselines</div><div style="height:32px;border:2px solid var(--border-control);border-radius:10px;padding:6px 10px" class="v">border-control · checkbox, switch, field, cell edges (3.6:1)</div><div style="height:32px;border:1.5px dashed var(--border-dashed);border-radius:10px;padding:7px 10px" class="v">border-dashed · empty add slots</div><div style="height:32px;outline:2px solid var(--focus);outline-offset:2px;border-radius:10px;padding:7px 10px" class="v">focus · 2px deep rose, 2px offset</div></div></div><script>(()=>{const hex=c=>{const m=c.match(/rgba?\(([^)]+)\)/);if(!m)return c.trim();const p=m[1].split(/[ ,\/]+/).map(Number);const h=p.slice(0,3).map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase();return p.length>3&&p[3]<1?"#"+h+" @"+p[3]:"#"+h;};const probe=document.createElement("i");document.body.appendChild(probe);document.querySelectorAll("[data-tok]").forEach(el=>{const host=el.closest("[data-theme]")||document.documentElement;host.appendChild(probe);probe.style.color="var(--"+el.dataset.tok+")";el.textContent=hex(getComputedStyle(probe).color);});probe.remove();})();</script></body></html>

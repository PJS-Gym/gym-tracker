<!-- @dsCard group="Spacing" viewport="700x170" name="Radii" subtitle="Soft rects for UI, pills for actions, big for media" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>PJS Gym · Radii</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-app);color:var(--text-1);font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:60px;display:flex;flex-direction:column;gap:4px}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--border-subtle)}.n{font-weight:700;color:var(--text-1)}.v{color:var(--text-2);font-variant-numeric:tabular-nums}.note{margin:14px 0 0;color:var(--text-2);font-size:13px;max-width:62ch}</style></head><body><div class="row"><div class="sw" style="align-items:center"><div style="width:72px;height:72px;background:var(--surface-raised);box-shadow:inset 0 0 0 1px var(--border-strong);border-radius:var(--radius-xs)"></div><div class="n">xs · 6</div><div class="v" style="text-align:center">previous cell</div></div><div class="sw" style="align-items:center"><div style="width:72px;height:72px;background:var(--surface-raised);box-shadow:inset 0 0 0 1px var(--border-strong);border-radius:var(--radius-sm)"></div><div class="n">sm · 10</div><div class="v" style="text-align:center">thumbs, checks, set rows</div></div><div class="sw" style="align-items:center"><div style="width:72px;height:72px;background:var(--surface-raised);box-shadow:inset 0 0 0 1px var(--border-strong);border-radius:var(--radius-md)"></div><div class="n">md · 14</div><div class="v" style="text-align:center">fields, tiles</div></div><div class="sw" style="align-items:center"><div style="width:72px;height:72px;background:var(--surface-raised);box-shadow:inset 0 0 0 1px var(--border-strong);border-radius:var(--radius-lg)"></div><div class="n">lg · 20</div><div class="v" style="text-align:center">cards, rest bar</div></div><div class="sw" style="align-items:center"><div style="width:72px;height:72px;background:var(--surface-raised);box-shadow:inset 0 0 0 1px var(--border-strong);border-radius:var(--radius-xl)"></div><div class="n">xl · 28</div><div class="v" style="text-align:center">sheets, media</div></div><div class="sw" style="align-items:center"><div style="width:72px;height:72px;background:var(--surface-raised);box-shadow:inset 0 0 0 1px var(--border-strong);border-radius:var(--radius-2xl)"></div><div class="n">2xl · 36</div><div class="v" style="text-align:center">featured card</div></div><div class="sw" style="align-items:center"><div style="width:72px;height:72px;background:var(--surface-raised);box-shadow:inset 0 0 0 1px var(--border-strong);border-radius:var(--radius-pill)"></div><div class="n">pill · 999</div><div class="v" style="text-align:center">buttons, chips</div></div></div><script>(()=>{const hex=c=>{const m=c.match(/rgba?\(([^)]+)\)/);if(!m)return c.trim();const p=m[1].split(/[ ,\/]+/).map(Number);const h=p.slice(0,3).map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase();return p.length>3&&p[3]<1?"#"+h+" @"+p[3]:"#"+h;};const probe=document.createElement("i");document.body.appendChild(probe);document.querySelectorAll("[data-tok]").forEach(el=>{const host=el.closest("[data-theme]")||document.documentElement;host.appendChild(probe);probe.style.color="var(--"+el.dataset.tok+")";el.textContent=hex(getComputedStyle(probe).color);});probe.remove();})();</script></body></html>

<!-- @dsCard group="Colors" viewport="700x200" name="On media" subtitle="data-surface="media": white, blush and petal over a scrim" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>PJS Gym · On media</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-app);color:var(--text-1);font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:60px;display:flex;flex-direction:column;gap:4px}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--border-subtle)}.n{font-weight:700;color:var(--text-1)}.v{color:var(--text-2);font-variant-numeric:tabular-nums}.note{margin:14px 0 0;color:var(--text-2);font-size:13px;max-width:62ch}</style></head><body><div class="row" style="gap:12px;flex-wrap:nowrap"><div style="flex:1;position:relative;height:150px;border-radius:20px;overflow:hidden;background:#fff"><div style="position:absolute;inset:0;background:rgba(0,0,0,.6)"></div><div data-surface="media" style="position:absolute;left:16px;bottom:14px;display:flex;flex-direction:column;gap:4px"><span style="color:var(--text-2);font-weight:700">Today · 28 min</span><span style="font-size:22px;font-weight:700">Power hour</span><span style="color:var(--text-accent);font-size:22px;font-weight:800">Saved</span></div><div class="v" style="position:absolute;right:12px;top:10px;color:#fff">worst case: white photo, .60 scrim</div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px;justify-content:center"><div style="display:flex;gap:8px;align-items:center"><span style="width:20px;height:20px;border-radius:6px;background:var(--on-media-1);box-shadow:inset 0 0 0 1px var(--border-strong)"></span><span class="n">on-media-1</span><span class="v">white · text-1 · 5.7:1+</span></div><div style="display:flex;gap:8px;align-items:center"><span style="width:20px;height:20px;border-radius:6px;background:var(--on-media-2);box-shadow:inset 0 0 0 1px var(--border-strong)"></span><span class="n">on-media-2</span><span class="v">blush · text-2, text-3 · 4.8:1+</span></div><div style="display:flex;gap:8px;align-items:center"><span style="width:20px;height:20px;border-radius:6px;background:var(--on-media-accent);box-shadow:inset 0 0 0 1px var(--border-strong)"></span><span class="n">on-media-accent</span><span class="v">petal · icons and large text only</span></div></div></div><script>(()=>{const hex=c=>{const m=c.match(/rgba?\(([^)]+)\)/);if(!m)return c.trim();const p=m[1].split(/[ ,\/]+/).map(Number);const h=p.slice(0,3).map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase();return p.length>3&&p[3]<1?"#"+h+" @"+p[3]:"#"+h;};const probe=document.createElement("i");document.body.appendChild(probe);document.querySelectorAll("[data-tok]").forEach(el=>{const host=el.closest("[data-theme]")||document.documentElement;host.appendChild(probe);probe.style.color="var(--"+el.dataset.tok+")";el.textContent=hex(getComputedStyle(probe).color);});probe.remove();})();</script></body></html>

<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4px base; 20px screen gutter; 44px targets, 48px in the logger" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>PJS Gym · Spacing scale</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-app);color:var(--text-1);font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:60px;display:flex;flex-direction:column;gap:4px}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--border-subtle)}.n{font-weight:700;color:var(--text-1)}.v{color:var(--text-2);font-variant-numeric:tabular-nums}.note{margin:14px 0 0;color:var(--text-2);font-size:13px;max-width:62ch}</style></head><body><div style="display:flex;gap:14px;align-items:flex-end"><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-1);height:var(--space-1);background:var(--pjs-petal);border-radius:2px"></div><div class="v">4</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-2);height:var(--space-2);background:var(--pjs-petal);border-radius:2px"></div><div class="v">8</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-3);height:var(--space-3);background:var(--pjs-petal);border-radius:2px"></div><div class="v">12</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-4);height:var(--space-4);background:var(--pjs-petal);border-radius:2px"></div><div class="v">16</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-5);height:var(--space-5);background:var(--pjs-petal);border-radius:2px"></div><div class="v">20</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-6);height:var(--space-6);background:var(--pjs-petal);border-radius:2px"></div><div class="v">24</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-8);height:var(--space-8);background:var(--pjs-petal);border-radius:2px"></div><div class="v">32</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-10);height:var(--space-10);background:var(--pjs-petal);border-radius:2px"></div><div class="v">40</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-12);height:var(--space-12);background:var(--pjs-petal);border-radius:2px"></div><div class="v">48</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-16);height:var(--space-16);background:var(--pjs-petal);border-radius:2px"></div><div class="v">64</div></div></div><p class="note">Gutter 20 · tiles gap 12 · card padding 16–20 · tap target 44 (--tap-min), logger controls 48 (--tap-logger) · top bar 52 · tab bar 84 including the home indicator.</p><script>(()=>{const hex=c=>{const m=c.match(/rgba?\(([^)]+)\)/);if(!m)return c.trim();const p=m[1].split(/[ ,\/]+/).map(Number);const h=p.slice(0,3).map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase();return p.length>3&&p[3]<1?"#"+h+" @"+p[3]:"#"+h;};const probe=document.createElement("i");document.body.appendChild(probe);document.querySelectorAll("[data-tok]").forEach(el=>{const host=el.closest("[data-theme]")||document.documentElement;host.appendChild(probe);probe.style.color="var(--"+el.dataset.tok+")";el.textContent=hex(getComputedStyle(probe).color);});probe.remove();})();</script></body></html>

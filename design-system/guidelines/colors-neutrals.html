<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>PJS Gym · Neutrals</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-app);color:var(--text-1);font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:60px;display:flex;flex-direction:column;gap:4px}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--border-subtle)}.n{font-weight:700;color:var(--text-1)}.v{color:var(--text-2);font-variant-numeric:tabular-nums}.note{margin:14px 0 0;color:var(--text-2);font-size:13px;max-width:62ch}</style></head><body><div class="row" style="gap:0"><div class="sw" style="min-width:0;gap:4px"><div style="height:56px;background:var(--ink-1000)"></div><div class="n">1000</div><div class="v" style="font-size:9px;letter-spacing:-.02em" data-tok="ink-1000"></div></div><div class="sw" style="min-width:0;gap:4px"><div style="height:56px;background:var(--ink-950)"></div><div class="n">950</div><div class="v" style="font-size:9px;letter-spacing:-.02em" data-tok="ink-950"></div></div><div class="sw" style="min-width:0;gap:4px"><div style="height:56px;background:var(--ink-900)"></div><div class="n">900</div><div class="v" style="font-size:9px;letter-spacing:-.02em" data-tok="ink-900"></div></div><div class="sw" style="min-width:0;gap:4px"><div style="height:56px;background:var(--ink-850)"></div><div class="n">850</div><div class="v" style="font-size:9px;letter-spacing:-.02em" data-tok="ink-850"></div></div><div class="sw" style="min-width:0;gap:4px"><div style="height:56px;background:var(--ink-800)"></div><div class="n">800</div><div class="v" style="font-size:9px;letter-spacing:-.02em" data-tok="ink-800"></div></div><div class="sw" style="min-width:0;gap:4px"><div style="height:56px;background:var(--ink-700)"></div><div class="n">700</div><div class="v" style="font-size:9px;letter-spacing:-.02em" data-tok="ink-700"></div></div><div class="sw" style="min-width:0;gap:4px"><div style="height:56px;background:var(--ink-600)"></div><div class="n">600</div><div class="v" style="font-size:9px;letter-spacing:-.02em" data-tok="ink-600"></div></div><div class="sw" style="min-width:0;gap:4px"><div style="height:56px;background:var(--ink-500)"></div><div class="n">500</div><div class="v" style="font-size:9px;letter-spacing:-.02em" data-tok="ink-500"></div></div><div class="sw" style="min-width:0;gap:4px"><div style="height:56px;background:var(--ink-400)"></div><div class="n">400</div><div class="v" style="font-size:9px;letter-spacing:-.02em" data-tok="ink-400"></div></div><div class="sw" style="min-width:0;gap:4px"><div style="height:56px;background:var(--ink-300)"></div><div class="n">300</div><div class="v" style="font-size:9px;letter-spacing:-.02em" data-tok="ink-300"></div></div><div class="sw" style="min-width:0;gap:4px"><div style="height:56px;background:var(--ink-200)"></div><div class="n">200</div><div class="v" style="font-size:9px;letter-spacing:-.02em" data-tok="ink-200"></div></div><div class="sw" style="min-width:0;gap:4px"><div style="height:56px;background:var(--ink-100)"></div><div class="n">100</div><div class="v" style="font-size:9px;letter-spacing:-.02em" data-tok="ink-100"></div></div><div class="sw" style="min-width:0;gap:4px"><div style="height:56px;background:var(--ink-50)"></div><div class="n">50</div><div class="v" style="font-size:9px;letter-spacing:-.02em" data-tok="ink-50"></div></div><div class="sw" style="min-width:0;gap:4px"><div style="height:56px;background:var(--ink-0)"></div><div class="n">0</div><div class="v" style="font-size:9px;letter-spacing:-.02em" data-tok="ink-0"></div></div></div><p class="note">text-1 = 900, text-2 = 700, text-3 = 600, control border = 500, raised and field fills = 100, sunken = 200.</p><script>(()=>{const hex=c=>{const m=c.match(/rgba?\(([^)]+)\)/);if(!m)return c.trim();const p=m[1].split(/[ ,\/]+/).map(Number);const h=p.slice(0,3).map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase();return p.length>3&&p[3]<1?"#"+h+" @"+p[3]:"#"+h;};const probe=document.createElement("i");document.body.appendChild(probe);document.querySelectorAll("[data-tok]").forEach(el=>{const host=el.closest("[data-theme]")||document.documentElement;host.appendChild(probe);probe.style.color="var(--"+el.dataset.tok+")";el.textContent=hex(getComputedStyle(probe).color);});probe.remove();})();</script></body></html>

<!-- @dsCard group="Type" viewport="700x210" name="Display" subtitle="Archivo Expanded, sentence case, one per screen" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>PJS Gym · Display</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-app);color:var(--text-1);font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:60px;display:flex;flex-direction:column;gap:4px}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--border-subtle)}.n{font-weight:700;color:var(--text-1)}.v{color:var(--text-2);font-variant-numeric:tabular-nums}.note{margin:14px 0 0;color:var(--text-2);font-size:13px;max-width:62ch}</style></head><body><div style="display:flex;flex-direction:column;gap:6px"><div class="pjs-display" style="font-size:var(--fs-display-xl);line-height:.9;font-weight:800">Legs and core</div><div class="pjs-display" style="font-size:var(--fs-display-l);font-weight:800">Push day</div><div class="pjs-display" style="font-size:var(--fs-display-m);line-height:.95;font-weight:800">Week 3 of strength</div><div class="v">display-xl 56/0.9 · display-l 40/0.92 · display-m 30/0.95 · wdth 125 · wght 800 (900 for the wordmark)</div></div><script>(()=>{const hex=c=>{const m=c.match(/rgba?\(([^)]+)\)/);if(!m)return c.trim();const p=m[1].split(/[ ,\/]+/).map(Number);const h=p.slice(0,3).map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase();return p.length>3&&p[3]<1?"#"+h+" @"+p[3]:"#"+h;};const probe=document.createElement("i");document.body.appendChild(probe);document.querySelectorAll("[data-tok]").forEach(el=>{const host=el.closest("[data-theme]")||document.documentElement;host.appendChild(probe);probe.style.color="var(--"+el.dataset.tok+")";el.textContent=hex(getComputedStyle(probe).color);});probe.remove();})();</script></body></html>

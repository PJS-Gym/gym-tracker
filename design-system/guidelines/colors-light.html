<!-- @dsCard group="Colors" viewport="700x170" name="Surfaces (dark)" subtitle="data-theme="dark": full-bleed media screens only" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>PJS Gym · Surfaces (dark)</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-app);color:var(--text-1);font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:60px;display:flex;flex-direction:column;gap:4px}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--border-subtle)}.n{font-weight:700;color:var(--text-1)}.v{color:var(--text-2);font-variant-numeric:tabular-nums}.note{margin:14px 0 0;color:var(--text-2);font-size:13px;max-width:62ch}</style></head><body><div data-theme="dark" style="background:var(--surface-app);padding:14px;border-radius:14px;color:var(--text-1)"><div class="row"><div class="sw"><div class="chip" style="background:var(--surface-app)"></div><div class="n">surface-app</div><div class="v" data-tok="surface-app"></div></div><div class="sw"><div class="chip" style="background:var(--surface-card)"></div><div class="n">surface-card</div><div class="v" data-tok="surface-card"></div></div><div class="sw"><div class="chip" style="background:var(--surface-raised)"></div><div class="n">surface-raised</div><div class="v" data-tok="surface-raised"></div></div><div class="sw"><div class="chip" style="background:var(--surface-field)"></div><div class="n">surface-field</div><div class="v" data-tok="surface-field"></div></div><div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="n">accent</div><div class="v" data-tok="accent"></div><div class=v>pink, ink label 5.37:1</div></div><div class="sw"><div class="chip" style="background:var(--text-accent)"></div><div class="n">text-accent</div><div class="v" data-tok="text-accent"></div><div class=v>petal</div></div></div></div><p class="note">Dark is for screens built on photography or video (workout detail, live class). Media inside light screens uses data-surface="media" instead.</p><script>(()=>{const hex=c=>{const m=c.match(/rgba?\(([^)]+)\)/);if(!m)return c.trim();const p=m[1].split(/[ ,\/]+/).map(Number);const h=p.slice(0,3).map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase();return p.length>3&&p[3]<1?"#"+h+" @"+p[3]:"#"+h;};const probe=document.createElement("i");document.body.appendChild(probe);document.querySelectorAll("[data-tok]").forEach(el=>{const host=el.closest("[data-theme]")||document.documentElement;host.appendChild(probe);probe.style.color="var(--"+el.dataset.tok+")";el.textContent=hex(getComputedStyle(probe).color);});probe.remove();})();</script></body></html>

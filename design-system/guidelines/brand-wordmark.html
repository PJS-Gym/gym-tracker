<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>PJS Gym · Wordmark</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-app);color:var(--text-1);font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:60px;display:flex;flex-direction:column;gap:4px}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--border-subtle)}.n{font-weight:700;color:var(--text-1)}.v{color:var(--text-2);font-variant-numeric:tabular-nums}.note{margin:14px 0 0;color:var(--text-2);font-size:13px;max-width:62ch}</style></head><body><div class="row" style="gap:12px;height:120px"><div style="flex:1;background:var(--surface-app);box-shadow:inset 0 0 0 1px var(--border-subtle);border-radius:20px;display:flex;align-items:center;justify-content:center;color:var(--ink-900)"><span class="pjs-display" style="font-size:34px;text-transform:uppercase;white-space:nowrap">PJS Gym</span></div><div style="flex:1;background:var(--pjs-pink);border-radius:20px;display:flex;align-items:center;justify-content:center;color:var(--ink-900)"><span class="pjs-display" style="font-size:34px;text-transform:uppercase;white-space:nowrap">PJS Gym</span></div><div data-theme="dark" style="flex:1;background:var(--ink-1000);border-radius:20px;display:flex;align-items:center;justify-content:center;color:var(--pjs-blush)"><span class="pjs-display" style="font-size:34px;text-transform:uppercase;white-space:nowrap">PJS <span style="color:var(--pjs-pink)">Gym</span></span></div></div><p class="note">Ink on white or pink (5.37:1). The pink-GYM lockup is only for dark or media surfaces at 28px or larger. Use the Wordmark component.</p><script>(()=>{const hex=c=>{const m=c.match(/rgba?\(([^)]+)\)/);if(!m)return c.trim();const p=m[1].split(/[ ,\/]+/).map(Number);const h=p.slice(0,3).map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase();return p.length>3&&p[3]<1?"#"+h+" @"+p[3]:"#"+h;};const probe=document.createElement("i");document.body.appendChild(probe);document.querySelectorAll("[data-tok]").forEach(el=>{const host=el.closest("[data-theme]")||document.documentElement;host.appendChild(probe);probe.style.color="var(--"+el.dataset.tok+")";el.textContent=hex(getComputedStyle(probe).color);});probe.remove();})();</script></body></html>

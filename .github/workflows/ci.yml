name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check app tests
      - run: uv run ruff format --check app tests

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym
          POSTGRES_DB: gym_tracker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gym -d gym_tracker"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql://gym:gym@localhost:5432/gym_tracker
      DATABASE_URL_UNPOOLED: postgresql://gym:gym@localhost:5432/gym_tracker
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: Unit tests
        run: uv run pytest tests/unit -q
      - name: Migrations apply, roll back and re-apply cleanly
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Integration tests (real Postgres)
        run: uv run pytest tests/integration -q

  frontend:
    name: Frontend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
      - working-directory: infra/github
        run: terraform init -backend=false && terraform fmt -check && terraform validate

  ci-passed:
    name: CI passed
    if: always()
    needs: [backend-lint, backend-test, frontend, terraform]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"


  terraform-apply:
    name: Terraform apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci-passed]
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ secrets.TERRAFORM_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
      - name: Require token
        run: test -n "$GITHUB_TOKEN" || { echo '::error::Set the TERRAFORM_GITHUB_TOKEN repository secret'; exit 1; }
      - working-directory: infra/github
        run: terraform init
      - working-directory: infra/github
        run: terraform plan -input=false
      - working-directory: infra/github
        run: terraform apply -input=false -auto-approve

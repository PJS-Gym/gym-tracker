[project]
name = "vercel-fastapi-starter"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "alembic>=1.20.1",
  "fastapi[standard]>=0.121.0",
  "httpx>=0.28",
  "jinja2>=3.1.4",
  "langfuse>=5.2.0",
  "psycopg-pool>=3.3.3",
  "psycopg[binary]>=3.3.6",
  "pydantic-settings>=2.2.1",
  "pyjwt[crypto]>=2.10",
  "uvicorn>=0.34.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project]
name = "vercel-fastapi-starter"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "alembic>=1.20.1",
  "fastapi[standard]>=0.121.0",
  "jinja2>=3.1.4",
  "langfuse>=5.2.0",
  "psycopg-pool>=3.3.3",
  "psycopg[binary]>=3.3.6",
  "pydantic-settings>=2.2.1",
  "uvicorn>=0.34.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

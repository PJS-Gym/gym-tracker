services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym
      POSTGRES_DB: gym_tracker
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gym_tracker"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres18_data:
